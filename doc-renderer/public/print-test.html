<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:-apple-system,'PingFang SC',sans-serif}
.chart{height:240px;width:650px;margin:20px}
h3{margin:20px 0 0}
@media print{ h3{page-break-before:always} .chart{page-break-inside:avoid} }
</style></head><body>
<h3>A 字符串 formatter（原 pairBars）</h3><div class="chart" id="a"></div>
<h3>B 函数 formatter</h3><div class="chart" id="b"></div>
<h3>C 无 label</h3><div class="chart" id="c"></div>
<h3>D 堆叠（原 stacked）</h3><div class="chart" id="d"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
const GREY='#CBD5E1',BLUE='#2563EB',GRID='#E2E8F0';
function base(el){const c=echarts.init(el,null,{renderer:'svg'});return c}
const xaxis={type:'category',data:['Q2','Q3'],axisLine:{show:false},axisTick:{show:false}};
const yaxis={type:'value',name:'CAC（元）',splitLine:{lineStyle:{color:GRID}}};
function pair(el,formatter){base(el).setOption({animation:false,xAxis:xaxis,yAxis:yaxis,series:[{type:'bar',barWidth:92,data:[
{value:18.5,itemStyle:{color:GREY},label:{show:true,position:'top',color:'#64748B',fontWeight:700,formatter:'18.5 元'}},
{value:15.2,itemStyle:{color:BLUE},label:{show:true,position:'top',color:BLUE,fontWeight:700,formatter:formatter}}]}]})}
pair(document.getElementById('a'),'15.2 元（−17.8%）');
pair(document.getElementById('b'),()=>'15.2 元（−17.8%）');
base(document.getElementById('c')).setOption({animation:false,xAxis:xaxis,yAxis:yaxis,series:[{type:'bar',barWidth:92,data:[
{value:18.5,itemStyle:{color:GREY}},{value:15.2,itemStyle:{color:BLUE}}]}]});
base(document.getElementById('d')).setOption({animation:false,xAxis:{type:'category',data:['Q2（共 10.4 万）','Q3（共 12.8 万）'],axisLine:{show:false},axisTick:{show:false}},
yAxis:{type:'value',name:'新增（万）',splitLine:{lineStyle:{color:GRID}}},
series:[
{name:'付费渠道',type:'bar',stack:'t',data:[10.4,10.7],itemStyle:{color:GREY},barWidth:92,label:{show:true,position:'inside',color:'#475569',fontWeight:700,formatter:p=>p.value+' 万'}},
{name:'裂变',type:'bar',stack:'t',data:[0,2.1],itemStyle:{color:BLUE},label:{show:true,position:'inside',color:'#fff',fontWeight:700,formatter:p=>p.value?p.value+' 万':''}}]});
</script></body></html>
