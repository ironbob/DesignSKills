<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>S1 今日任务卡 · 高保真</title><style>body{margin:0;background:#e9e2d3;display:flex;flex-wrap:wrap;gap:36px;justify-content:center;padding:20px;font-family:"Songti SC","PingFang SC",serif}

.opts{margin-top:20px}

.opt.pick{border-color:#b4552d;color:#b4552d;font-weight:700}

.fb.bad{background:#f6e3dc;color:#8f3b2f}.fb.good{background:#e4ede6;color:#3e6b4f}
.rows{flex:1;min-height:0;overflow:hidden;padding:8px 16px}
.row{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid #e5dcc8;padding:8px 0;background:transparent}
.w{font-size:15px;font-weight:700;color:#2f2a22;flex:1}.m{font-size:11px;color:#7a6f5d}
.st{font-size:11px;border-radius:3px;padding:2px 8px}
.st.ok{background:#e4ede6;color:#3e6b4f}.st.no{background:#f6e3dc;color:#8f3b2f}.st.re{background:#e6e6f0;color:#5a5a8f}
.empty{color:#7a6f5d;font-size:14px;text-align:center;padding:30px 0}
.seg{display:flex;margin:10px 16px;border:1px solid #d8cbb0;border-radius:6px;background:#ffffff}
.seg div{flex:1;text-align:center;padding:9px 0;font-size:13px;color:#7a6f5d}
.seg div.on{background:#b4552d;color:#ffffff;border-radius:6px 6px 0 0}
.mono{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:#5a5a8f}
